name: CI Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install linting tools
        run: |
          pip install ruff black isort
      - name: Check Python formatting (Black)
        run: black --check --diff scripts/
      - name: Check import sorting (isort)
        run: isort --check-only --diff scripts/
      - name: Lint with Ruff
        run: ruff check scripts/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt
      # Sin `|| echo`: un test rojo debe romper el build (antes el job no podía fallar).
      - name: Run tests
        run: python -m pytest scripts/ -v

  check-js:
    name: Check JS Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check src/js/main.js
          node --check src/js/data.js

  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.1.1
        with:
          root: .

  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
