name: 🔄 Update Baloto Data & Analysis

on:
  schedule:
    # Run after each draw: Mon/Wed/Sat at 00:30 UTC (approx 7:30 PM COT previous day)
    - cron: '30 0 * * 1,3,6'
    # Also run daily at 06:00 UTC as backup
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no new draws'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-analyze:
    name: 📊 Fetch Data & Run Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r baloto-oracle/requirements.txt
      
      - name: Fetch latest Baloto data
        id: fetch
        run: |
          cd baloto-oracle
          python scripts/fetch_baloto_data.py
          # Check if data was updated
          if git diff --quiet data/processed/baloto.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new data found"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New data detected"
          fi
      
      - name: Run statistical analysis
        run: |
          cd baloto-oracle
          python scripts/analyze_baloto.py

      - name: Generate embedded data.js
        run: |
          cd baloto-oracle
          python scripts/generate_data_js.py
      
      - name: Verify analysis output
        run: |
          cd baloto-oracle
          python -c "
          import json
          with open('data/processed/analysis_results.json') as f:
              data = json.load(f)
          print(f'Analysis complete: {len(data.get(\"descriptive\", {}))} descriptive sections')
          print(f'Inferential tests: {len(data.get(\"inferential\", {}))} tests')
          print(f'Predictions: {len(data.get(\"predictions\", {}))} sections')
          "
      
      - name: Commit and push data changes
        if: steps.fetch.outputs.changed == 'true' || github.event.inputs.force_update == 'true'
        run: |
          cd baloto-oracle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ src/js/data.js
          git commit -m "🔄 Update Baloto data & analysis - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: fetch-and-analyze
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: baloto-oracle
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: 📢 Notify on Changes
    needs: [fetch-and-analyze, deploy]
    if: needs.fetch-and-analyze.outputs.changed == 'true' || github.event.inputs.force_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          echo "✅ Baloto data updated and deployed!"
          echo "📊 New analysis available at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "🕐 Updated: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Add webhook notifications here if needed (Slack, Discord, Email, etc.)